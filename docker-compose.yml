version: '3.8'

services:
  db:
    image: postgres:15
    container_name: luxman_db_prod
    environment:
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./02_plpython_function.sql:/docker-entrypoint-initdb.d/2_plpython_function.sql

  mongo:
    image: mongo:7
    container_name: luxman_mongo_prod
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./LuxmanBackend
    container_name: luxman_backend_prod
    ports:
      - "5294:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=admin
      - ConnectionStrings__LuxmanDb=Host=db;Port=5432;Database=postgres;Username=postgres;Password=admin
      - ConnectionStrings__MongoDb=mongodb://mongo:27017
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_DESTINO=${SMTP_DESTINO:-equipos@luxman.tech}
      - APP_BASE_URL=${APP_BASE_URL:-https://luxman.tech}
    depends_on:
      - db
      - mongo

  frontend:
    build: ./luxman-frontend
    container_name: luxman_frontend_prod
    ports:
      - "8080:80"
    volumes:
      - ./luxman-frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
