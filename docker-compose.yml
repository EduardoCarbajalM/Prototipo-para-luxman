version: '3.8'

services:
  db:
    image: postgres:15
    container_name: luxman_db_prod
    environment:
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Opcional: puedes mapear tus scripts SQL para que se auto-ejecuten al iniciar
      # - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  backend:
    build: ./LuxmanBackend
    container_name: luxman_backend_prod
    ports:
      - "5294:8080"
    environment:
      - ConnectionStrings__LuxmanDb=Host=db;Port=5432;Database=postgres;Username=postgres;Password=admin
    depends_on:
      - db

  frontend:
    build: ./luxman-frontend
    container_name: luxman_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: